<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Humanly</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .box {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 32px 30px;
    width: 100%;
    max-width: 380px;
  }

  h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.3px; color: #111; }
  .sub { font-size: 0.85rem; color: #888; margin-top: 5px; margin-bottom: 22px; }

  label {
    display: block; font-size: 0.75rem; font-weight: 600; color: #555;
    text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px;
  }

  input[type="password"] {
    width: 100%;
    font-family: inherit;
    font-size: 0.95rem;
    padding: 11px 12px;
    border: 1px solid #ddd;
    border-radius: 5px;
    background: #fafafa;
    color: #222;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  input[type="password"]:focus { border-color: #111; background: #fff; }

  button {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    color: #fff;
    background: #111;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #333; }

  .error {
    background: #fdecea;
    border: 1px solid #f5c2bd;
    color: #8a2018;
    font-size: 0.83rem;
    padding: 10px 12px;
    border-radius: 5px;
    margin-bottom: 16px;
  }

  .foot { font-size: 0.75rem; color: #aaa; margin-top: 20px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>

<form class="box" method="post" action="/login">
  <h1>Humanly</h1>
  <div class="sub">Imran Tauqir's AI writing pipeline</div>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <input type="hidden" name="next" value="{{ next }}">

  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password"
         autofocus required>

  <button type="submit">Sign in</button>

  <div class="foot">
    Generating an article spends API credits.<br>This page is why it isn't open to everyone.
  </div>
</form>

</body>
</html>
